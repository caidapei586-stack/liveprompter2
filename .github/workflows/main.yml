name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 若仓库里带的是 zip 则自动解压
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "解压 $ZIP_FILE"
            unzip -oq "$ZIP_FILE"
          fi

      - name: 3. 自动定位源码根目录
        run: |
          set -e
          APP_FILE=$(find . -name "LivePrompterApp.swift" | head -n 1)
          if [ -z "$APP_FILE" ]; then
            echo "未找到 LivePrompterApp.swift，请确认源码已完整上传"
            exit 1
          fi
          APP_DIR=$(dirname "$APP_FILE")
          BASE=$(basename "$APP_DIR")
          if [ "$BASE" = "App" ]; then
            SOURCE_ROOT=$(dirname "$APP_DIR")
          else
            SOURCE_ROOT="$APP_DIR"
          fi
          SOURCE_ROOT=$(cd "$SOURCE_ROOT" && pwd)
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "源码根目录：$SOURCE_ROOT"
          echo "目录内容："
          ls "$SOURCE_ROOT"

      - name: 4. 写入自动生成的 project.yml（自动适配目录结构）
        run: |
          set -e
          python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b64decode(''))" > "$SOURCE_ROOT/project.yml"
          echo "已写入 project.yml 到 $SOURCE_ROOT"
          cat "$SOURCE_ROOT/project.yml"

      - name: 5. 自动修正 PiPManager.swift（移除 iOS 16 专属的画中画可选方法，兼容 iOS 15）
        run: |
          set -e
          PIP=$(find "$SOURCE_ROOT" -name "PiPManager.swift" | head -n 1)
          if [ -z "$PIP" ]; then
            echo "未找到 PiPManager.swift，跳过自动修正"
            exit 0
          fi
          python3 -c "import base64,sys; open('$PIP','wb').write(base64.b64decode(''))"
          echo "已用 iOS 15 兼容版本覆盖 $PIP"

      - name: 6. 安装 XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: 7. 生成 Xcode 工程
        working-directory: ${{ env.SOURCE_ROOT }}
        run: xcodegen generate

      - name: 8. 修正工程格式版本（把 Xcode 16 格式 77 降到 15.4 可读的 56）
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 56/' LivePrompter.xcodeproj/project.pbxproj
          echo "修正后的 objectVersion："
          grep "objectVersion = " LivePrompter.xcodeproj/project.pbxproj | head -n 1

      - name: 9. 编译（不签名，交给 Sideloadly 后续签名）
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project LivePrompter.xcodeproj \
            -scheme LivePrompter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build.log

      - name: 10. 打印编译错误汇总（始终执行，便于排查）
        if: always()
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          echo "==== 编译错误汇总（供排查，把下面带 error: 的行发给我）===="
          grep -nE "error:|BUILD FAILED|error generated|fatal error:" build.log | head -80 || echo "（未捕获到 error 行）"
          echo "==== 汇总结束 ===="

      - name: 11. 打包成标准 .ipa
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          set -e
          mkdir -p Payload
          APP_PATH=$(find build -name "LivePrompter.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 LivePrompter.app，编译可能失败"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r -q LivePrompter.ipa Payload

      - name: 12. 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: LivePrompter-iOS-IPA
          path: ${{ env.SOURCE_ROOT }}/LivePrompter.ipa
